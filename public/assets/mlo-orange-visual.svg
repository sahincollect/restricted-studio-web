<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0d"/>
      <stop offset="1" stop-color="#17110c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1309"/>
      <stop offset="0.48" stop-color="#0e0b09"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EA580C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FDBA74" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#EA580C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ledSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EA580C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F97316" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#EA580C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e24"/>
      <stop offset="1" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="counterGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="54%">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.52"/>
      <stop offset="0.48" stop-color="#EA580C" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#060608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pool" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0.46"/>
      <stop offset="0.55" stop-color="#F97316" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FED7AA" stop-opacity="0.72"/>
      <stop offset="0.35" stop-color="#F97316" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="72%">
      <stop offset="62%" stop-color="#060608" stop-opacity="0"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0.78"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="#060608"/>

  <!-- architectural room planes -->
  <polygon points="180,120 620,120 620,300 180,300" fill="url(#wall)"/>
  <polygon points="0,0 180,120 180,300 0,420" fill="#0b0b0e"/>
  <polygon points="800,0 620,120 620,300 800,420" fill="#0b0b0e"/>
  <polygon points="0,0 800,0 620,120 180,120" fill="#08080a"/>
  <polygon points="0,420 180,300 620,300 800,420 800,500 0,500" fill="url(#floor)"/>

  <!-- ceiling cove LED (pure layered strokes, zero blur filter) -->
  <polygon points="40,28 760,28 610,112 190,112" fill="none" stroke="#EA580C" stroke-opacity="0.18" stroke-width="18"/>
  <polygon points="40,28 760,28 610,112 190,112" fill="none" stroke="#F97316" stroke-opacity="0.42" stroke-width="7"/>
  <polygon points="40,28 760,28 610,112 190,112" fill="none" stroke="#FDBA74" stroke-width="1.7"/>
  <line x1="180" y1="120" x2="620" y2="120" stroke="#FB923C" stroke-width="2"/>

  <!-- warm back-wall glow -->
  <rect x="180" y="120" width="440" height="180" fill="url(#glow)"/>

  <!-- architectural wall slats -->
  <g stroke="#1d1814" stroke-width="3">
    <line x1="230" y1="126" x2="230" y2="296"/><line x1="270" y1="126" x2="270" y2="296"/>
    <line x1="310" y1="126" x2="310" y2="296"/><line x1="350" y1="126" x2="350" y2="296"/>
    <line x1="450" y1="126" x2="450" y2="296"/><line x1="490" y1="126" x2="490" y2="296"/>
    <line x1="530" y1="126" x2="530" y2="296"/><line x1="570" y1="126" x2="570" y2="296"/>
  </g>

  <!-- back shelves with warm orange LED underglow -->
  <rect x="296" y="198" width="208" height="14" fill="url(#counterGlow)"/>
  <rect x="300" y="196" width="200" height="4" fill="#FB923C"/>
  <rect x="296" y="248" width="208" height="12" fill="url(#counterGlow)"/>
  <rect x="300" y="246" width="200" height="4" fill="#FB923C"/>
  <g fill="#F97316" opacity="0.86">
    <rect x="312" y="172" width="8" height="24" rx="2"/><rect x="332" y="176" width="8" height="20" rx="2"/>
    <rect x="352" y="170" width="8" height="26" rx="2"/><rect x="372" y="178" width="8" height="18" rx="2"/>
    <rect x="392" y="172" width="8" height="24" rx="2"/><rect x="412" y="176" width="8" height="20" rx="2"/>
    <rect x="432" y="170" width="8" height="26" rx="2"/><rect x="452" y="178" width="8" height="18" rx="2"/>
    <rect x="472" y="172" width="8" height="24" rx="2"/>
  </g>
  <g fill="#FDBA74" opacity="0.72">
    <rect x="312" y="222" width="8" height="24" rx="2"/><rect x="352" y="224" width="8" height="22" rx="2"/>
    <rect x="392" y="220" width="8" height="26" rx="2"/><rect x="432" y="224" width="8" height="22" rx="2"/>
    <rect x="472" y="222" width="8" height="24" rx="2"/>
  </g>

  <!-- structural pillars with orange edge strips -->
  <g>
    <rect x="150" y="60" width="34" height="260" fill="#0f0f13"/>
    <rect x="150" y="60" width="3" height="260" fill="#F97316" opacity="0.92"/>
    <rect x="616" y="60" width="34" height="260" fill="#0f0f13"/>
    <rect x="647" y="60" width="3" height="260" fill="#F97316" opacity="0.92"/>
  </g>

  <!-- floor reflections & perspective lines -->
  <ellipse cx="400" cy="372" rx="270" ry="50" fill="url(#pool)"/>
  <line x1="60" y1="440" x2="740" y2="440" stroke="url(#ledSoft)" stroke-width="10"/>
  <line x1="60" y1="440" x2="740" y2="440" stroke="url(#led)" stroke-width="2.4"/>
  <line x1="120" y1="404" x2="680" y2="404" stroke="url(#ledSoft)" stroke-width="7"/>
  <line x1="120" y1="404" x2="680" y2="404" stroke="url(#led)" stroke-width="1.8"/>
  <polygon points="180,300 220,300 120,500 0,500" fill="none" stroke="#F97316" stroke-opacity="0.34" stroke-width="1.5"/>
  <polygon points="620,300 580,300 680,500 800,500" fill="none" stroke="#F97316" stroke-opacity="0.34" stroke-width="1.5"/>

  <!-- bar counter & fluted orange ribs -->
  <polygon points="250,318 550,318 590,352 210,352" fill="#232329"/>
  <rect x="210" y="352" width="380" height="58" fill="url(#counter)"/>
  <rect x="210" y="405" width="380" height="18" fill="url(#counterGlow)"/>
  <rect x="210" y="404" width="380" height="3" fill="#FB923C"/>
  <polygon points="250,318 550,318 590,352 210,352" fill="none" stroke="#FDBA74" stroke-width="1.4"/>
  <g fill="#F97316" opacity="0.9">
    <rect x="236" y="368" width="4" height="26"/><rect x="268" y="368" width="4" height="26"/>
    <rect x="300" y="368" width="4" height="26"/><rect x="332" y="368" width="4" height="26"/>
    <rect x="364" y="368" width="4" height="26"/><rect x="396" y="368" width="4" height="26"/>
    <rect x="428" y="368" width="4" height="26"/><rect x="460" y="368" width="4" height="26"/>
    <rect x="492" y="368" width="4" height="26"/><rect x="524" y="368" width="4" height="26"/>
    <rect x="556" y="368" width="4" height="26"/>
  </g>

  <!-- bar stools -->
  <g>
    <ellipse cx="300" cy="446" rx="22" ry="6" fill="#1f1f25"/><rect x="298" y="428" width="4" height="18" fill="#2a2a31"/><ellipse cx="300" cy="426" rx="20" ry="6" fill="#F97316"/>
    <ellipse cx="400" cy="454" rx="24" ry="7" fill="#1f1f25"/><rect x="398" y="434" width="4" height="20" fill="#2a2a31"/><ellipse cx="400" cy="432" rx="22" ry="7" fill="#FB923C"/>
    <ellipse cx="500" cy="446" rx="22" ry="6" fill="#1f1f25"/><rect x="498" y="428" width="4" height="18" fill="#2a2a31"/><ellipse cx="500" cy="426" rx="20" ry="6" fill="#F97316"/>
  </g>

  <!-- pendant lights with radialGradient halos (zero Gaussian blur) -->
  <g>
    <line x1="300" y1="112" x2="300" y2="262" stroke="#2a2a31" stroke-width="1.5"/>
    <circle cx="300" cy="266" r="38" fill="url(#lampGlow)"/>
    <circle cx="300" cy="266" r="8.5" fill="#FDBA74"/>
    <line x1="400" y1="112" x2="400" y2="246" stroke="#2a2a31" stroke-width="1.5"/>
    <circle cx="400" cy="250" r="44" fill="url(#lampGlow)"/>
    <circle cx="400" cy="250" r="9.5" fill="#FED7AA"/>
    <line x1="500" y1="112" x2="500" y2="262" stroke="#2a2a31" stroke-width="1.5"/>
    <circle cx="500" cy="266" r="38" fill="url(#lampGlow)"/>
    <circle cx="500" cy="266" r="8.5" fill="#FDBA74"/>
  </g>

  <!-- radial vignette (zero blur filter) -->
  <rect width="800" height="500" fill="url(#vignette)"/>
</svg>
