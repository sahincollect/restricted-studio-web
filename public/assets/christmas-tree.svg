<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 200" fill="none">
  <defs>
    <!-- Pine Gradients -->
    <linearGradient id="treeTop" x1="80" y1="40" x2="80" y2="85" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10b981"/>
      <stop offset="0.6" stop-color="#047857"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="treeMid" x1="80" y1="75" x2="80" y2="125" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/>
      <stop offset="0.6" stop-color="#047857"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="treeBot" x1="80" y1="110" x2="80" y2="165" gradientUnits="userSpaceOnUse">
      <stop stop-color="#047857"/>
      <stop offset="0.6" stop-color="#065f46"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="80" cy="30" r="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>

    <!-- Ornament Gradients -->
    <radialGradient id="ornRed" cx="35%" cy="35%" r="65%">
      <stop stop-color="#fca5a5"/>
      <stop offset="0.4" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#991b1b"/>
    </radialGradient>
    <radialGradient id="ornGold" cx="35%" cy="35%" r="65%">
      <stop stop-color="#fef08a"/>
      <stop offset="0.4" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="ornCyan" cx="35%" cy="35%" r="65%">
      <stop stop-color="#bae6fd"/>
      <stop offset="0.4" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#0369a1"/>
    </radialGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Star Ambient Glow -->
  <circle cx="80" cy="30" r="24" fill="url(#starGlow)"/>

  <!-- Tree Trunk -->
  <path d="M72 160 H88 V182 C88 184 86 186 84 186 H76 C74 186 72 184 72 182 Z" fill="#78350f"/>
  <rect x="74" y="160" width="3" height="24" fill="#92400e" opacity="0.6"/>

  <!-- Bottom Tier -->
  <path d="M80 108 L126 162 C116 164 104 158 98 162 C90 166 84 160 80 162 C76 160 70 166 62 162 C56 158 44 164 34 162 Z" fill="url(#treeBot)"/>
  <!-- Bottom Tier Snow Trim -->
  <path d="M34 162 C44 164 56 158 62 162 C70 166 76 160 80 162 C84 160 90 166 98 162 C104 158 116 164 126 162 C118 160 106 154 98 157 C90 161 84 156 80 157 C76 156 70 161 62 157 C54 154 42 160 34 162 Z" fill="#e0f2fe" opacity="0.6"/>

  <!-- Middle Tier -->
  <path d="M80 72 L116 120 C108 122 98 116 92 120 C86 123 82 118 80 120 C78 118 74 123 68 120 C62 116 52 122 44 120 Z" fill="url(#treeMid)"/>
  <!-- Middle Tier Snow Trim -->
  <path d="M44 120 C52 122 62 116 68 120 C74 123 78 118 80 120 C82 118 86 123 92 120 C98 116 108 122 116 120 C110 118 100 113 92 116 C86 119 82 115 80 116 C78 115 74 119 68 116 C60 113 50 118 44 120 Z" fill="#e0f2fe" opacity="0.65"/>

  <!-- Top Tier -->
  <path d="M80 38 L104 82 C98 84 90 80 85 83 C82 85 81 82 80 83 C79 82 78 85 75 83 C70 80 62 84 56 82 Z" fill="url(#treeTop)"/>
  <!-- Top Tier Snow Trim -->
  <path d="M56 82 C62 84 70 80 75 83 C78 85 79 82 80 83 C81 82 82 85 85 83 C90 80 98 84 104 82 C99 80 92 76 85 79 C82 81 81 78 80 79 C79 78 78 81 75 79 C68 76 61 80 56 82 Z" fill="#f0fdf4" opacity="0.7"/>

  <!-- Garland Beads / Fairy Light Strands (Swags) -->
  <path d="M68 62 Q80 72 92 64" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
  <path d="M54 98 Q80 114 106 100" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="2 3" fill="none"/>
  <path d="M42 138 Q80 156 118 140" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-dasharray="2 3" fill="none"/>

  <!-- Baubles & Ornaments -->
  <!-- Top Tier Ornaments -->
  <circle cx="80" cy="58" r="4.5" fill="url(#ornRed)"/>
  <circle cx="71" cy="72" r="4" fill="url(#ornGold)"/>
  <circle cx="90" cy="74" r="4" fill="url(#ornCyan)"/>

  <!-- Mid Tier Ornaments -->
  <circle cx="62" cy="100" r="5" fill="url(#ornCyan)"/>
  <circle cx="82" cy="94" r="5" fill="url(#ornGold)"/>
  <circle cx="98" cy="106" r="4.5" fill="url(#ornRed)"/>
  <circle cx="74" cy="112" r="4.5" fill="url(#ornRed)"/>

  <!-- Bottom Tier Ornaments -->
  <circle cx="48" cy="142" r="5.5" fill="url(#ornGold)"/>
  <circle cx="68" cy="138" r="5" fill="url(#ornRed)"/>
  <circle cx="92" cy="144" r="5.5" fill="url(#ornCyan)"/>
  <circle cx="110" cy="148" r="5" fill="url(#ornGold)"/>
  <circle cx="82" cy="150" r="4.5" fill="url(#ornRed)"/>

  <!-- Glowing Golden Star Topper -->
  <polygon points="80,18 83,27 92,27 85,33 88,42 80,36 72,42 75,33 68,27 77,27" fill="#f59e0b" filter="url(#softGlow)"/>
  <polygon points="80,20 82,27 89,27 84,32 86,39 80,34 74,39 76,32 71,27 78,27" fill="#fef08a"/>

  <!-- Gift Boxes Under Tree -->
  <!-- Red Gift Left -->
  <rect x="42" y="172" width="22" height="18" rx="2" fill="#dc2626"/>
  <rect x="51" y="172" width="4" height="18" fill="#fbbf24"/>
  <rect x="42" y="179" width="22" height="4" fill="#fbbf24"/>
  <!-- Ribbon Bow -->
  <ellipse cx="49" cy="170" rx="3.5" ry="2" fill="#fbbf24"/>
  <ellipse cx="57" cy="170" rx="3.5" ry="2" fill="#fbbf24"/>

  <!-- Blue Gift Right -->
  <rect x="96" y="170" width="24" height="20" rx="2" fill="#0284c7"/>
  <rect x="106" y="170" width="4" height="20" fill="#ffffff"/>
  <rect x="96" y="178" width="24" height="4" fill="#ffffff"/>
  <!-- Ribbon Bow -->
  <ellipse cx="104" cy="168" rx="4" ry="2.5" fill="#ffffff"/>
  <ellipse cx="112" cy="168" rx="4" ry="2.5" fill="#ffffff"/>

  <!-- Small Gold Gift Front Center -->
  <rect x="71" y="176" width="16" height="14" rx="2" fill="#f59e0b"/>
  <rect x="77" y="176" width="3" height="14" fill="#ef4444"/>
  <rect x="71" y="181" width="16" height="3" fill="#ef4444"/>
</svg>
