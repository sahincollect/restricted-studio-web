<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="capRed" x1="24" y1="90" x2="94" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b91c1c"/>
      <stop offset="0.4" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="capShadow" x1="24" y1="90" x2="70" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#881337"/>
      <stop offset="1" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="fluffGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Red Cap Main Body -->
  <path d="M22 86 C25 58 48 24 92 20 C98 24 102 36 86 50 C74 60 56 72 22 86 Z" fill="url(#capRed)" filter="url(#softShadow)"/>
  <path d="M22 86 C25 58 48 24 92 20 C80 34 62 54 66 84 Z" fill="url(#capShadow)" opacity="0.5"/>

  <!-- Cap Tail / Droop curving down right -->
  <path d="M92 20 C102 26 110 38 104 52 C100 58 92 60 88 54 C84 48 88 32 82 24 Z" fill="#b91c1c"/>

  <!-- Fluffy White Trim (Brim) -->
  <rect x="12" y="78" width="76" height="20" rx="10" fill="url(#fluffGrad)" filter="url(#softShadow)"/>
  <circle cx="22" cy="88" r="9" fill="#ffffff"/>
  <circle cx="36" cy="88" r="10" fill="#ffffff"/>
  <circle cx="50" cy="88" r="10" fill="#f8fafc"/>
  <circle cx="64" cy="88" r="10" fill="#ffffff"/>
  <circle cx="76" cy="88" r="9" fill="#f1f5f9"/>

  <!-- Fluffy Pom-Pom -->
  <circle cx="102" cy="56" r="13" fill="url(#fluffGrad)" filter="url(#softShadow)"/>
  <circle cx="100" cy="54" r="9" fill="#ffffff"/>
  <circle cx="104" cy="58" r="6" fill="#f1f5f9"/>
</svg>
